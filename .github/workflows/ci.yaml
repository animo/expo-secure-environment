name: Pipeline

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      release-type:
        description: "Type of release (major, minor, patch, alpha)"
        required: true
        default: alpha
        type: choice
        options:
          - major
          - minor
          - patch
          - alpha

jobs:
  continuous-integration:
    name: "Continuous Integration"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      # Only install the library, the example app isn't needed for CI and downloads native askar binaries on install
      - name: Install dependencies
        run: pnpm install --filter @animo-id/expo-secure-environment

      - name: Style
        run: pnpm style:check

      - name: Build
        run: pnpm build

      - name: Check types
        run: pnpm types:check

  # Runs the React Native Harness tests in example/tests on an emulator and a simulator. These have no secure hardware
  # or biometrics, so the tests that need those only run on physical devices (pnpm test:android:device / test:ios:device)
  test-android:
    name: "Test Android"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install

      - name: Build the example app
        working-directory: example
        run: node harness/run.mjs android --build-only

      # Harness creates and boots the emulator from rn-harness.config.mjs and installs the app
      - name: Run the tests
        uses: callstackincubator/react-native-harness@v1.6.0
        with:
          runner: android
          app: android/app/build/outputs/apk/debug/app-debug.apk
          projectRoot: example
          packageManager: pnpm

  test-ios:
    name: "Test iOS"
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build the example app
        working-directory: example
        run: node harness/run.mjs ios --build-only

      # Harness boots the newest iPhone simulator and installs the app
      - name: Run the tests
        uses: callstackincubator/react-native-harness@v1.6.0
        with:
          runner: ios
          app: ios/build/Build/Products/Debug-iphonesimulator/exposecureenvironmentexample.app
          projectRoot: example
          packageManager: pnpm

  continuous-deployment:
    if: github.event_name == 'workflow_dispatch'

    name: "Continuous Deployment"
    runs-on: ubuntu-latest
    needs: ["continuous-integration"]

    permissions:
      contents: write
      # Needed for npm trusted publishing (OIDC token exchange + provenance)
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm >= 11 implements `pnpm publish` natively, including the OIDC token
      # exchange for npm trusted publishing, so no npm CLI upgrade is needed
      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --filter @animo-id/expo-secure-environment

      - name: Build
        run: pnpm build

      - name: Set git configuration
        run: |
          git config user.name "Animo Solutions"
          git config user.email "development@animo.id"

      - name: Publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ${{ inputs.release-type }} == 'alpha' ]; then
            pnpm release --preRelease=alpha
          else
            pnpm release -i=${{ inputs.release-type }}
          fi
