plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'id.animo.secure.environment'
version = '0.1.0'

android {
  namespace "id.animo.secure.environment"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.2.0-alpha05"
}
